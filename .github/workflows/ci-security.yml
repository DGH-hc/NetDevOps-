name: CI Security

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r app/ scripts/ rules/ signals/ -ll

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run dependency security audit
        run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-2858
          --ignore-vuln PYSEC-2026-1325

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  manifest-precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render Kubernetes manifests
        run: helm template ./charts > rendered.yaml

      - name: Validate rendered manifest
        run: |
          test -s rendered.yaml

          if grep -n -E \
            "privileged:\s*true|allowPrivilegeEscalation:\s*true|hostNetwork:\s*true|hostPID:\s*true|hostPath:" \
            rendered.yaml; then
            echo "::error::Dangerous Kubernetes configuration detected"
            exit 1
          fi

          echo "Basic manifest pre-check passed."

  iac-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint ./charts

      - name: Helm template
        run: helm template ./charts > rendered.yaml

      - name: Scan for dangerous flags
        run: |
          if grep -n -E \
            "privileged:\s*true|allowPrivilegeEscalation:\s*true|hostNetwork:\s*true|hostPID:\s*true|hostPath:" \
            rendered.yaml; then
            echo "::error::Dangerous Kubernetes config detected"
            exit 1
          fi

          echo "No blocking dangerous flags found."

  security-gate:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - lint
      - unit-test
      - sast
      - dependency-security
      - secret-scan
      - manifest-precheck
      - iac-validate

    steps:
      - name: Verify security checks
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint failed"
            exit 1
          fi

          if [ "${{ needs.unit-test.result }}" != "success" ]; then
            echo "::error::unit-test failed"
            exit 1
          fi

          if [ "${{ needs.sast.result }}" != "success" ]; then
            echo "::error::sast failed"
            exit 1
          fi

          if [ "${{ needs.dependency-security.result }}" != "success" ]; then
            echo "::error::dependency-security failed"
            exit 1
          fi

          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "::error::secret-scan failed"
            exit 1
          fi

          if [ "${{ needs.manifest-precheck.result }}" != "success" ]; then
            echo "::error::manifest-precheck failed"
            exit 1
          fi

          if [ "${{ needs.iac-validate.result }}" != "success" ]; then
            echo "::error::iac-validate failed"
            exit 1
          fi

          echo "All Phase 4.1 security checks passed."